name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generate standard Android project
        run: |
          rm -rf android
          flutter create --platforms=android --project-name=esurfing --org=com.wyu --description="aiqin" .

      - name: Inject custom Android files
        run: |
          cp android_custom/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/wyu/esurfing
          cp android_custom/app/src/main/java/com/wyu/esurfing/MainActivity.java android/app/src/main/java/com/wyu/esurfing/MainActivity.java
          cp android_custom/app/src/main/java/com/wyu/esurfing/MonitorService.java android/app/src/main/java/com/wyu/esurfing/MonitorService.java
          cp android_custom/app/src/main/java/com/wyu/esurfing/ClientAccessibilityService.java android/app/src/main/java/com/wyu/esurfing/ClientAccessibilityService.java
          mkdir -p android/app/src/main/res/xml
          cp android_custom/app/src/main/res/xml/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
